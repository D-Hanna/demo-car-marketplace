server:
  port: 8080

spring:
  application:
    name: car-marketplace-backend
  datasource:
    url: jdbc:h2:mem:cardb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mvc:
    problemdetails:
      enabled: true

logging:
  level:
    com.marketplace.car: DEBUG
    org.springframework.web: INFO
